name: Build native Apple Dictionary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos-dictionary:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build browser edition (web shards)
        run: |
          python fetch_sources.py
          python export_web.py \
            --hmt-body data/hmt-body.data \
            --dehkhoda data/dehkhoda-lexicon.json \
            --kaikki data/kaikki-persian.jsonl \
            --cover build/cover.png --out build/webdata
      - name: Build native Apple .dictionary
        run: ./scripts/build-macos.sh
      - name: Verify ZIP and checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt
          unzip -l "Morad's Persian-English Dictionary.dictionary.zip" | grep -E 'Body.data|KeyText.index|EntryID.index'
      - name: Upload distributable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morads-Persian-English-Dictionary-macOS
          path: |
            dist/Morad's Persian-English Dictionary.dictionary.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/latest.md
          files: |
            dist/Morad's Persian-English Dictionary.dictionary.zip
            dist/SHA256SUMS.txt