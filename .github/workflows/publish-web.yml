name: Publish browser dictionary
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source integrity and download pinned lexical data
        run: python fetch_sources.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build cross-platform dictionary
        run: |
          python export_web.py \
            --hmt-body data/hmt-body.data \
            --dehkhoda data/dehkhoda-lexicon.json \
            --kaikki data/kaikki-persian.jsonl \
            --cover build/cover.png --out site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
